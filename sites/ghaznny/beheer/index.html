<style>
:root{
  --zwart:#0c0c0c; --nacht:#131313; --kool:#1b1b1b; --vlak:#202020; --lijn:rgba(243,239,232,.11);
  --ivoor:#f3efe8; --tekst:#cdc9c2; --zacht:#a39f98; --salie:#8fa5a2; --leisteen:#495a58;
  --rood:#e39a91; --groen:#86cfa4;
  --f-logo:'Bodoni Moda','Didot',serif; --f-kop:'Playfair Display',Georgia,serif; --f-tekst:'Roboto',system-ui,sans-serif;
  --uur:64px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--zwart);color:var(--ivoor);font:400 .95rem/1.5 var(--f-tekst);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--salie);outline-offset:2px}
.wm{display:inline-flex;align-items:baseline;font-family:var(--f-logo);text-transform:uppercase;line-height:1;white-space:nowrap}
.wm i{font-style:normal;margin-right:.42em}.wm i:last-child{margin-right:0}
.wm .lam svg{height:.705em;width:.66em;fill:currentColor;display:inline-block}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.85em 1.3em;border:1px solid var(--ivoor);background:transparent;font:500 .72rem/1 var(--f-tekst);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s}
.knop:hover{background:var(--ivoor);color:var(--zwart)}
.knop.vol{background:var(--ivoor);color:var(--zwart)}
.knop.vol:hover{background:var(--salie);border-color:var(--salie)}
.knop.stil{border-color:var(--lijn)}
.knop:disabled{opacity:.5;cursor:wait}

/* Inloggen */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(70% 60% at 50% 0%,#18201f,var(--zwart) 70%)}
.login form{width:min(400px,100%);border:1px solid var(--lijn);background:rgba(19,19,19,.9);padding:40px 32px}
.login .wm{font-size:1.9rem;display:flex;justify-content:center;margin-bottom:10px}
.login .ondertitel{text-align:center;font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--salie);margin-bottom:34px}
.veld{display:grid;gap:7px;margin-bottom:16px}
.veld label{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tekst)}
.veld input,.veld select,.veld textarea{background:var(--kool);border:1px solid var(--lijn);padding:12px 13px;border-radius:0;width:100%;font-weight:300}
.veld input:focus,.veld select:focus,.veld textarea:focus{outline:none;border-color:var(--salie)}
.veld textarea{min-height:70px;resize:vertical}
.login .knop{width:100%;margin-top:8px}
.login .hulp{font-size:.82rem;color:var(--zacht);margin-top:18px;text-align:center}
.login .demo{background:none;border:0;color:var(--salie);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:.82rem}
.fout{color:var(--rood);font-size:.86rem;min-height:1.2em;margin:4px 0 0}

/* App */
.app{display:none;min-height:100vh;flex-direction:column}
body.ingelogd .login{display:none}
body.ingelogd .app{display:flex}
.balk{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(16px,3vw,32px);border-bottom:1px solid var(--lijn);background:var(--nacht);position:sticky;top:0;z-index:20}
.balk .links{display:flex;align-items:center;gap:18px;min-width:0}
.balk .wm{font-size:1.15rem}
.balk .titel{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--salie);border-left:1px solid var(--lijn);padding-left:18px;white-space:nowrap}
.balk .rechts{display:flex;align-items:center;gap:14px;font-size:.84rem;color:var(--tekst)}
.balk .rechts a{color:var(--tekst);text-decoration:none}
.balk .rechts a:hover{color:var(--ivoor)}
.balk .uit{background:none;border:1px solid var(--lijn);padding:.55em .9em;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tekst)}
.balk .uit:hover{color:var(--ivoor);border-color:var(--ivoor)}
@media (max-width:640px){.balk .titel,.balk .rechts .naam,.balk .rechts a{display:none}}
.demobanner{background:var(--leisteen);color:var(--ivoor);font-size:.84rem;text-align:center;padding:9px 16px}
.demobanner button{background:none;border:0;text-decoration:underline;padding:0;margin-left:8px}

main{padding:24px clamp(16px,3vw,32px) 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;flex:1}
.kpi{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--lijn);background:var(--nacht);padding:18px 20px}
.kpi small{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tekst);margin-bottom:10px}
.kpi b{font:400 1.9rem/1 var(--f-kop)}
.kpi span{display:block;font-size:.82rem;color:var(--zacht);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}

.werkbalk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:8px}
.nav button.pijl{width:38px;height:38px;background:none;border:1px solid var(--lijn);display:grid;place-items:center}
.nav button.pijl:hover{border-color:var(--ivoor)}
.nav button.vandaag{background:none;border:1px solid var(--lijn);height:38px;padding:0 14px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.nav button.vandaag:hover{border-color:var(--ivoor)}
.nav h2{font:400 1.45rem/1.1 var(--f-kop);margin:0 0 0 10px;text-transform:capitalize}
.weergave{display:flex;border:1px solid var(--lijn)}
.weergave button{background:none;border:0;padding:.75em 1.1em;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tekst)}
.weergave button[aria-pressed=true]{background:var(--ivoor);color:var(--zwart)}
.werkbalk .rechts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legenda{display:flex;gap:14px;font-size:.78rem;color:var(--tekst)}
.legenda i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
@media (max-width:640px){.nav h2{font-size:1.1rem}.legenda{display:none}}

/* Kalender (week/dag) */
.kalender{border:1px solid var(--lijn);background:var(--nacht);overflow:auto;max-height:calc(100vh - 290px);min-height:420px;position:relative}
.rooster{display:grid;min-width:720px;position:relative}
.rooster.dag{min-width:0}
.kopcel{position:sticky;top:0;z-index:5;background:var(--nacht);border-bottom:1px solid var(--lijn);border-left:1px solid var(--lijn);padding:10px 8px;text-align:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tekst)}
.kopcel b{display:block;font:400 1.35rem/1.2 var(--f-kop);letter-spacing:0;color:var(--ivoor);text-transform:none}
.kopcel.nu b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ivoor);color:var(--zwart);margin-top:2px}
.kopcel.hoek{border-left:0;left:0;z-index:6}
.uren{position:sticky;left:0;z-index:4;background:var(--nacht)}
.uren div{height:var(--uur);font-size:.72rem;color:var(--zacht);text-align:right;padding:0 8px 0 0;transform:translateY(-.6em)}
.kolom{position:relative;border-left:1px solid var(--lijn);background:repeating-linear-gradient(180deg,transparent 0 calc(var(--uur) - 1px),var(--lijn) calc(var(--uur) - 1px) var(--uur)),repeating-linear-gradient(180deg,transparent 0 calc(var(--uur)/2 - 1px),rgba(243,239,232,.035) calc(var(--uur)/2 - 1px) calc(var(--uur)/2))}
.kolom.dicht{background-color:rgba(255,255,255,.015)}
.kolom .gesloten{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px)}
.kolom.vandaag{background-color:rgba(143,165,162,.04)}
.nulijn{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--rood);z-index:3}
.nulijn::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--rood)}
.blok{position:absolute;left:4px;right:4px;border:0;border-left:3px solid var(--ivoor);background:#2a2926;text-align:left;padding:5px 8px;overflow:hidden;font-size:.78rem;line-height:1.3;z-index:2;transition:transform .15s,box-shadow .15s}
.blok:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:3}
.blok b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok span{color:#cfcac2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok.clinic{border-left-color:var(--salie);background:#1f2928}
.blok.geannuleerd,.blok.niet-verschenen{opacity:.5;background:repeating-linear-gradient(135deg,#1e1e1e 0 6px,#232323 6px 12px)}
.blok.geannuleerd b{text-decoration:line-through}
.blok.voltooid{opacity:.72}
.leegcel{position:absolute;left:0;right:0;z-index:1;background:none;border:0;padding:0}
.leegcel:hover{background:rgba(243,239,232,.05)}

/* Maand */
.maand{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--lijn);border-width:1px 0 0 1px;background:var(--nacht)}
.maand .wd{padding:10px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tekst);border-right:1px solid var(--lijn);border-bottom:1px solid var(--lijn)}
.maand .cel{min-height:112px;padding:8px;border-right:1px solid var(--lijn);border-bottom:1px solid var(--lijn);text-align:left;background:none;border-top:0;border-left:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.maand .cel:hover{background:rgba(243,239,232,.03)}
.maand .cel.anders{opacity:.35}
.maand .cel .d{font:400 1.05rem/1 var(--f-kop);margin-bottom:4px}
.maand .cel.nu .d{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ivoor);color:var(--zwart);font-size:.9rem}
.maand .chip{font-size:.72rem;padding:2px 6px;background:#2a2926;border-left:2px solid var(--ivoor);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maand .chip.clinic{border-left-color:var(--salie);background:#1f2928}
.maand .chip.geannuleerd{opacity:.45;text-decoration:line-through}
.maand .meer{font-size:.72rem;color:var(--tekst)}
@media (max-width:700px){.maand .cel{min-height:70px;padding:5px}.maand .chip{display:none}.maand .cel .aantal{display:block}}
.maand .aantal{display:none;font-size:.7rem;color:var(--salie)}

/* Lijst */
.lijst{border:1px solid var(--lijn);background:var(--nacht)}
.lijst .dagkop{padding:12px 18px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--salie);background:var(--kool);border-bottom:1px solid var(--lijn)}
.lijst .rij{display:grid;grid-template-columns:110px 1fr auto auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--lijn);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lijst .rij:hover{background:rgba(243,239,232,.03)}
.lijst .rij .t{font:400 1.1rem/1 var(--f-kop)}
.lijst .rij small{display:block;color:var(--tekst);font-size:.8rem}
.lijst .leeg{padding:40px 18px;text-align:center;color:var(--tekst)}
@media (max-width:600px){.lijst .rij{grid-template-columns:70px 1fr auto}.lijst .rij .prijs{display:none}}
.label{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:.45em .7em;border:1px solid var(--lijn);white-space:nowrap}
.label.bevestigd{border-color:rgba(134,207,164,.45);color:var(--groen)}
.label.voltooid{color:var(--tekst)}
.label.geannuleerd,.label.niet-verschenen{border-color:rgba(227,154,145,.4);color:var(--rood)}

/* Paneel & dialoog */
.schaduw{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s}
.schaduw.open{opacity:1;visibility:visible}
.lade{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--nacht);border-left:1px solid var(--lijn);z-index:41;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.lade.open{transform:none}
.lade header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 18px;border-bottom:1px solid var(--lijn)}
.lade header h3{font:400 1.6rem/1.2 var(--f-kop);margin:6px 0 0}
.lade .sluit{background:none;border:1px solid var(--lijn);width:36px;height:36px;flex:none}
.lade .sluit:hover{border-color:var(--ivoor)}
.lade .body{padding:20px 24px;overflow:auto;flex:1;display:grid;gap:18px;align-content:start}
.gegeven small{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tekst);margin-bottom:4px}
.gegeven{font-size:.98rem}
.gegeven a{color:var(--ivoor)}
.rij2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.contactknoppen{display:flex;gap:8px;flex-wrap:wrap}
.statusknoppen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statusknoppen button{background:none;border:1px solid var(--lijn);padding:.8em;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.statusknoppen button:hover{border-color:var(--ivoor)}
.statusknoppen button[aria-pressed=true]{background:var(--ivoor);color:var(--zwart);border-color:var(--ivoor)}
.opmerking{background:var(--kool);border:1px solid var(--lijn);padding:12px;font-size:.92rem;color:#d8d3cb;white-space:pre-wrap}
.velden2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.velden2 .vol{grid-column:1/-1}
.melding{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);visibility:hidden;background:var(--ivoor);color:var(--zwart);padding:12px 18px;font-size:.88rem;z-index:60;transition:transform .3s;max-width:calc(100% - 32px)}
.melding.zicht{transform:translate(-50%,0);visibility:visible}
.laden{padding:30px;text-align:center;color:var(--tekst)}
</style>
</head>

  /* ---------- Laden ---------- */
  function bereik(){
    if(weergave==='dag') return [focus,plusDagen(focus,1)];

    if(weergave==='maand'){var b=maandag(new Date(focus.getFullYear(),focus.getMonth(),1));return [b,plusDagen(b,42)];}
    return [startDag(new Date()),plusDagen(startDag(new Date()),60)];

  function laad(forceer){
    var b=bereik(), van=plusDagen(maandag(b[0]),-7), tot=plusDagen(b[1],14), sleutel=van.toISOString()+tot.toISOString();
    if(demo) return Promise.resolve();
    var kpiVan=startDag(new Date()), kpiTot=plusDagen(maandag(new Date()),7);
    if(kpiVan<van) van=kpiVan; if(kpiTot>tot) tot=kpiTot;
    if(!forceer && geladenBereik && geladenBereik.van<=van && geladenBereik.tot>=tot) return Promise.resolve();
    return api('site_afspraken?select=*&site_id=eq.'+SITE_ID+'&start=gte.'+encodeURIComponent(van.toISOString())+'&start=lt.'+encodeURIComponent(tot.toISOString())+'&order=start.asc')

  function tekenWeergave(){ if(weergave==='maand') maandWeergave(); else if(weergave==='lijst') lijstWeergave(); else rooster(); }

  function rooster(){
    var dagen=[], begin=weergave==='dag'?focus:maandag(focus), n=weergave==='dag'?1:7, nu=new Date(), uurPx=64;
    for(var i=0;i<n;i++) dagen.push(plusDagen(begin,i));

    html+='<div class="uren">';for(var u=VAN;u<TOT;u++) html+='<div>'+pad(u)+':00</div>';html+='</div>';

  function maandWeergave(){

    var namen=['Yassin B.','Daan K.','Mohammed A.','Sem de V.','Rayan E.','Jesse M.','Omar H.','Levi P.','Noah S.','Bilal Z.','Thijs R.','Amir T.','Lucas W.','Sami O.'];

    function rnd(){zaad=(zaad*16807)%2147483647;return (zaad-1)/2147483646;}
    var populair=['knippen','knippen','haar-baard','haar-baard','haar-baard','vip','knippen-kids','clinic-basis','clinic-diepte','clinic-compleet','clinic-peeling','harsen','gezicht'];
    for(var dag=0;dag<35;dag++){
      var d=plusDagen(start,dag), wd=(d.getDay()+6)%7, eind=TIJDEN[wd][1]*60, m=10*60+Math.floor(rnd()*3)*15;
      while(m<eind-30){
        if(rnd()<.35){m+=15*(1+Math.floor(rnd()*4));continue;}
        var dn=dienst(populair[Math.floor(rnd()*populair.length)]);
        if(m+dn.duur>eind) break;
        var s=new Date(d);s.setHours(0,m,0,0);var e=new Date(s.getTime()+dn.duur*6e4);
        var verleden=e<new Date(); teller++;
        lijst.push({id:'demo-'+teller,dienst_id:dn.id,dienst:dn.naam,prijs:dn.prijs,start:s.toISOString(),eind:e.toISOString(),naam:namen[Math.floor(rnd()*namen.length)],telefoon:'06 '+(10000000+Math.floor(rnd()*89999999)),email:null,opmerking:rnd()<.15?'Graag een mid fade, bovenop iets korter.':null,status:verleden?(rnd()<.06?'Niet verschenen':'Voltooid'):(rnd()<.05?'Geannuleerd':'Bevestigd'),aangemaakt_op:new Date(s.getTime()-864e5*2).toISOString(),ip_hash:rnd()<.7?'x':null});
        m+=Math.ceil(dn.duur/15)*15;
      }
    }
    return lijst;
  }
