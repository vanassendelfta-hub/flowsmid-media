    <path d="M254 22 L262 22 L288 78 L277 78 Z"/>
    <rect x="224" y="76.6" width="19" height="1.4"/>
    <rect x="270" y="76.6" width="25" height="1.4"/>
    <text x="330" y="78" font-family="'Bodoni Moda','Didot','Bodoni 72',serif" font-size="80" font-weight="400">Z</text>
    <text x="428" y="78" font-family="'Bodoni Moda','Didot','Bodoni 72',serif" font-size="80" font-weight="400">N</text>
    <text x="530" y="78" font-family="'Bodoni Moda','Didot','Bodoni 72',serif" font-size="80" font-weight="400">N</text>
    <text x="632" y="78" font-family="'Bodoni Moda','Didot','Bodoni 72',serif" font-size="80" font-weight="400">Y</text>
  </g>
