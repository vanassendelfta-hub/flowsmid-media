<!doctype html>
<html lang="nl">
<head>
<script src="https://flowsmid.nl/demomodus.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Beheer | Barbershop Ocean</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="/logo/oceanbarber-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--zwart:#0d0d0d;--paneel:#161616;--kaart:#1c1c1c;--lijn:#2a2a2a;--lijn2:#222;--tekst:#ececea;--zacht:#8f8f8c;--wit:#f5f5f2;--fout:#ff6b5e;--ok:#7bd88f;--waarsch:#e9b949;--r:12px;--uur:64px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--zwart);color:var(--tekst);font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.kop{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;background:var(--wit);color:#0d0d0d;font-weight:600;white-space:nowrap}
.knop:hover{background:#fff}
.knop.grijs{background:#262626;color:var(--tekst)}
.knop.grijs:hover{background:#303030}
.knop.rood{background:#3a1d1b;color:#ffb3ab}
.knop.klein{height:32px;padding:0 12px;font-size:13px}
.knop:disabled{opacity:.45;cursor:not-allowed}
.ikoon{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;background:#222}
.ikoon:hover{background:#2e2e2e}
input,select,textarea{color-scheme:dark;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #303030;background:#111;outline:none}
input:focus,select:focus,textarea:focus{border-color:#9a9a9a}
label.veld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--zacht)}
label.veld > *{color:var(--tekst);font-size:14px}
.rij2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rij3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1d1d1d,#0b0b0b 70%)}
.loginkaart{width:100%;max-width:380px;padding:30px;border-radius:18px;background:var(--paneel);border:1px solid var(--lijn)}
.loginkaart img{width:220px;display:block;margin:-10px auto 6px}
.loginkaart h1{text-align:center;font-size:20px;margin-bottom:20px}
.loginkaart form{display:grid;gap:12px}
.loginkaart .knop{width:100%;height:44px;margin-top:4px}
.loginfout{color:var(--fout);min-height:20px;font-size:13px;text-align:center}
.loginkaart .uitleg{color:var(--zacht);font-size:12.5px;text-align:center;margin-top:14px}
.demolink{display:block;margin:14px auto 0;color:#cfcfcf;text-decoration:underline;font-size:13px}
body.ingelogd #login{display:none}
#app{display:none}
body.ingelogd #app{display:flex}

/* App */
#app{min-height:100vh}
aside.menu{width:232px;flex:0 0 232px;background:var(--paneel);border-right:1px solid var(--lijn);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside.menu img{width:150px;margin:0 0 14px 6px}
aside.menu button.tab{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#bdbdbd;font-weight:500;text-align:left}
aside.menu button.tab:hover{background:#1f1f1f;color:#fff}
aside.menu button.tab[aria-current="true"]{background:#262626;color:#fff}
aside.menu .onder{margin-top:auto;padding:12px;border-top:1px solid var(--lijn);font-size:12.5px;color:var(--zacht)}
aside.menu .onder b{color:var(--tekst);display:block;font-size:14px}
main{flex:1;min-width:0;padding:22px 26px 60px}
.paginakop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.paginakop h1{font-size:28px}
.demobalk{background:#2b2410;border:1px solid #5a4a1a;color:#f3d88a;padding:9px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--paneel);border:1px solid var(--lijn)}
.kpi small{color:var(--zacht);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.kpi b{display:block;font:600 26px/1.2 Oswald,sans-serif}
.kaart{background:var(--paneel);border:1px solid var(--lijn);border-radius:var(--r);padding:18px}
.balk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:#1d1d1d;border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;color:#bdbdbd;font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:#000}
.periode{font:600 18px/1 Oswald,sans-serif;text-transform:uppercase;margin:0 6px;min-width:160px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:#1d1d1d;border:1px solid #2c2c2c;font-size:12.5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.4}

/* Kalender */
.kal{display:grid;border:1px solid var(--lijn);border-radius:var(--r);overflow:hidden;background:#121212;position:relative}
.kal .kopcel{position:sticky;top:0;z-index:3;background:#181818;border-bottom:1px solid var(--lijn);padding:10px 8px;text-align:center;font-weight:600;font-size:13px}
.kal .kopcel small{display:block;color:var(--zacht);font-weight:500;font-size:11.5px}
.kal .kopcel.vandaag{color:#fff;box-shadow:inset 0 -2px 0 #fff}
.kal .uren{border-right:1px solid var(--lijn)}
.kal .uur{height:var(--uur);font-size:11px;color:var(--zacht);text-align:right;padding:2px 6px 0 0;border-top:1px solid var(--lijn2)}
.kal .kolom{position:relative;border-right:1px solid var(--lijn2);cursor:copy}
.kal .kolom:last-child{border-right:0}
.kal .kolom .lijntje{height:var(--uur);border-top:1px solid var(--lijn2)}
.kal .kolom .lijntje::after{content:"";display:block;height:50%;border-bottom:1px dashed #1c1c1c}
.vrij{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#0d0d0d 0 6px,#111 6px 12px);pointer-events:none}
.blok{position:absolute;left:3px;right:3px;border-radius:7px;background:repeating-linear-gradient(135deg,#262626 0 6px,#1f1f1f 6px 12px);border:1px solid #333;font-size:11.5px;color:#aaa;padding:3px 7px;overflow:hidden;cursor:pointer;z-index:1}
.afspr{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 8px;overflow:hidden;font-size:12px;line-height:1.3;cursor:pointer;z-index:2;color:#0d0d0d;box-shadow:0 2px 8px rgba(0,0,0,.35);border-left:4px solid rgba(0,0,0,.35)}
.afspr b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afspr span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.afspr.Geannuleerd,.afspr.Niet-verschenen{opacity:.35;text-decoration:line-through}
.afspr.Voltooid{filter:saturate(.35)}
.afspr .web{position:absolute;right:6px;top:4px;font-size:10px;font-weight:700;opacity:.7}
.nulijn{position:absolute;left:0;right:0;height:2px;background:#ff5a4e;z-index:4;pointer-events:none}
.nulijn::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ff5a4e}
.kal-scroll{max-height:calc(100vh - 290px);min-height:420px;overflow:auto;border-radius:var(--r)}
/* Maand */
.maand{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.maand .wd{color:var(--zacht);font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:0 4px}
.maand .dag{min-height:96px;border-radius:10px;background:var(--paneel);border:1px solid var(--lijn);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.maand .dag.anders{opacity:.35}
.maand .dag.vandaag{border-color:#fff}
.maand .dag b{font:600 16px/1 Oswald,sans-serif}
.maand .bolletjes{display:flex;flex-wrap:wrap;gap:3px}
.maand .bolletjes i{width:7px;height:7px;border-radius:50%}
.maand .aantal{margin-top:auto;font-size:12px;color:var(--zacht)}
/* Lijst */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--lijn)}
th{color:var(--zacht);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
tr.klik{cursor:pointer}
tr.klik:hover td{background:#1a1a1a}
.status{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#243326;color:var(--ok)}
.status.Geannuleerd{background:#3a1d1b;color:#ffb3ab}
.status.Niet-verschenen{background:#3a2f12;color:var(--waarsch)}
.status.Voltooid{background:#262626;color:#cfcfcf}
.stip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
/* Rooster */
.rooster{display:grid;grid-template-columns:150px repeat(7,minmax(120px,1fr));gap:6px;overflow-x:auto}
.rooster .k{font-weight:600;display:flex;align-items:center;gap:6px}
.rooster .h{color:var(--zacht);font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-align:center}
.rcel{border-radius:10px;background:#141414;border:1px solid var(--lijn);padding:6px;min-height:62px;display:flex;flex-direction:column;gap:4px}
.rcel .blokje{display:grid;grid-template-columns:1fr auto;gap:3px;background:#242424;border-radius:7px;padding:5px;font-size:12.5px}
.rcel .blokje .tot{grid-column:1}
.rcel .blokje button{grid-column:2;grid-row:1/3}
.rcel .blokje input{padding:3px 4px;border-radius:6px;font-size:12.5px;width:100%;min-width:0;border:1px solid #333;background:#181818}
.rcel .blokje button{color:var(--zacht);font-size:15px;line-height:1;padding:0 2px}
.rcel .plus{font-size:12px;color:var(--zacht);padding:4px;border-radius:7px;border:1px dashed #333}
.rcel .plus:hover{color:#fff;border-color:#666}
.rcel.leeg{justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* Team */
.teamkaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tk{background:var(--paneel);border:1px solid var(--lijn);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.tk .top{display:flex;align-items:center;gap:12px}
.tk .mono{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:600 20px/1 Oswald,sans-serif;color:#0d0d0d;flex:none;overflow:hidden}
.tk .mono img,.fotovoorbeeld img{width:100%;height:100%;object-fit:cover;display:block}
.fotokies{display:flex;align-items:center;gap:14px}
.fotovoorbeeld{width:84px;height:84px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:#222;border:2px solid #333;font:600 30px/1 Oswald,sans-serif;color:#0d0d0d}
.fotokies .knoppen{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fotokies small{color:var(--zacht);font-size:12px}
.fotokies label.knop{cursor:pointer}
.tk .acc{background:#121212;border:1px solid var(--lijn);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tk .acc code{background:#222;padding:2px 7px;border-radius:6px;font-size:13px}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:10px}
.schakel input{width:auto;accent-color:#fff;transform:scale(1.2)}
.kleuren{display:flex;gap:6px;flex-wrap:wrap}
.kleuren button{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.kleuren button[aria-pressed="true"]{border-color:#fff}
/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .doos{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--paneel);border:1px solid #333;border-radius:16px;padding:22px}
.modal h2{font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal form{display:grid;gap:12px}
.modal .acties{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.modal .acties div{display:flex;gap:8px}
.vrijetijden{display:flex;flex-wrap:wrap;gap:6px}
.vrijetijden button{padding:5px 9px;border-radius:8px;background:#222;font-size:12.5px}
.vrijetijden button:hover{background:#333}
.melding{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;background:#fff;color:#000;padding:11px 18px;border-radius:999px;font-weight:600;z-index:80;pointer-events:none}
.melding.zicht{opacity:1;transform:translateX(-50%)}
.melding.fout{background:var(--fout)}
.laden{padding:40px;text-align:center;color:var(--zacht)}
.alleen-eigenaar{}
body.rol-kapper .alleen-eigenaar{display:none!important}
.mobielmenu{display:none}
.mobielkop{display:none}
.seg .k{display:none}
aside.menu button.tab .k{display:none}
.rk{margin-bottom:12px;padding:12px 14px}
.rk-kop{font-weight:600;font-size:16px;display:flex;align-items:center;margin-bottom:6px}
.rk-dag{display:grid;grid-template-columns:30px 1fr 40px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--lijn2)}
.rk-dag > b{font:600 14px/1 Oswald,sans-serif;text-transform:uppercase;color:#cfcfcf}
.rk-dag.vrijdag > b{color:var(--zacht)}
.rk-blokken{display:flex;flex-direction:column;gap:6px;min-width:0}
.rk-blokken .blokje{display:grid;grid-template-columns:1fr 1fr 32px;gap:6px;align-items:center}
.rk-blokken .blokje input{padding:8px 6px;min-width:0}
.rk-blokken .blokje .tot{grid-column:2;grid-row:1}
.rk-blokken .blokje button{grid-column:3;grid-row:1;width:32px;height:32px;border-radius:8px;background:#242424;color:var(--zacht);font-size:18px}
.rk-vrij{color:var(--zacht);font-size:13px}
.rk-dag .plus{width:40px;height:36px;border-radius:9px;border:1px dashed #3a3a3a;color:#cfcfcf;font-size:18px}
@media (max-width:900px){
  #app{flex-direction:column}
  /* kopbalk boven, tabbalk onder zoals een app */
  .mobielkop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:rgba(13,13,13,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--lijn)}
  .mobielkop img{height:40px;width:auto}
  .mobielkop span{flex:1;min-width:0;color:var(--zacht);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  aside.menu{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;width:100%;height:auto;flex-direction:row;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--lijn);background:rgba(22,22,22,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  aside.menu img,aside.menu .onder{display:none}
  aside.menu button.tab{flex:1;min-width:0;flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;border-radius:10px;text-align:center}
  aside.menu button.tab svg{width:22px;height:22px}
  aside.menu button.tab .l{display:none}
  aside.menu button.tab .k{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  aside.menu button.tab[aria-current="true"]{background:transparent;color:#fff}
  aside.menu button.tab[aria-current="true"] svg{background:#2c2c2c;border-radius:8px;box-shadow:0 0 0 5px #2c2c2c}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px}
  label.veld > *{font-size:16px}
  .melding{bottom:calc(90px + env(safe-area-inset-bottom))}
  /* agenda-balk: weergave + vandaag, dan ‹ periode ›, dan kappers */
  .balk{display:grid;grid-template-columns:40px 1fr auto 40px;gap:8px;align-items:center}
  .balk #seg{grid-column:1/3;grid-row:1}
  .balk #vandaag{grid-column:3/5;grid-row:1;height:38px}
  .balk #vorige{grid-column:1;grid-row:2;width:40px;height:40px}
  .balk #periode{grid-column:2/4;grid-row:2;text-align:center;margin:0}
  .balk #volgende{grid-column:4;grid-row:2;width:40px;height:40px}
  .balk > span[style]{display:none}
  .balk #filters{grid-column:1/-1;grid-row:3}
  .seg{display:flex}
  .seg button{flex:1;padding:8px 10px}
  #lseg{grid-column:1/-1}
  .seg .l{display:none}
  .seg .k{display:inline}
  #zoek{max-width:none!important}
  .balk #lseg ~ *{grid-column:1/-1}
  /* cijfers als schuifbare strook */
  .kpis{display:flex;overflow-x:auto;gap:8px;margin:0 -12px 14px;padding:0 12px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 auto;min-width:138px;max-width:200px;padding:10px 12px}
  .kpi small{font-size:10.5px}
  /* tabellen worden kaarten */
  table.kaarttabel thead{display:none}
  table.kaarttabel,table.kaarttabel tbody{display:block}
  table.kaarttabel tr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--lijn)}
  table.kaarttabel td{display:block;padding:0;border:0}
  .lijsttabel td:nth-child(1){order:1;flex:1}
  .lijsttabel td:nth-child(6){order:2}
  .lijsttabel td:nth-child(2){order:3;flex-basis:100%;font-weight:600;font-size:15px}
  .lijsttabel td:nth-child(2) br{display:none}
  .lijsttabel td:nth-child(2) small{font-weight:400;margin-left:6px}
  .lijsttabel td:nth-child(3){order:4;color:#cfcfcf}
  .lijsttabel td:nth-child(4){order:5;color:#cfcfcf}
  .lijsttabel td:nth-child(5){order:6;margin-left:auto;font-weight:600}
  #lijst{padding:0!important}
  .dienstentabel td:nth-child(1){flex-basis:100%}
  .dienstentabel td:nth-child(2),.dienstentabel td:nth-child(3),.dienstentabel td:nth-child(4){color:#cfcfcf}
  .dienstentabel td:nth-child(4)::before{content:"Online: "}
  .dienstentabel td:nth-child(5){margin-left:auto}
  .afwtabel tr{padding:10px 0}
  .afwtabel td:nth-child(2){flex:1}
  .afwtabel td:nth-child(3){flex-basis:100%;order:3;color:#cfcfcf}
  /* instellingen: dag + twee tijden passen naast elkaar */
  #if .rij3{grid-template-columns:78px 1fr 1fr;gap:6px}
  #if .rij3 input{padding:9px 6px;min-width:0}
  .rij2{gap:8px}
  .rij2 > *{min-width:0}
  /* venster schuift van onder in beeld */
  .modal{align-items:flex-end;padding:0}
  .modal .doos{max-width:none;border-radius:18px 18px 0 0;max-height:94vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-bottom:0}
  .modal .acties{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--paneel);padding:10px 0 4px;margin-bottom:-4px}
  .teamkaarten{grid-template-columns:1fr}
  .paginakop .knop{height:36px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .kal-scroll{max-height:none}
  .periode{min-width:0;font-size:16px}
  .kpi b{font-size:19px}
  .paginakop h1{font-size:22px}
}
</style>
</head>
<body>

<section id="login">
  <div class="loginkaart">
    <img src="/logo/oceanbarber-logo.svg" alt="Barbershop Ocean">
    <h1 class="kop">Beheer</h1>
    <form id="loginform" autocomplete="on">
      <label class="veld">Gebruikersnaam<input id="l-naam" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>

  /* ---------- Rooster ---------- */

      (mobiel()?'':'<div class="kaart" style="margin-bottom:16px"><div class="rooster"><div></div>'+DAGEN.map(function(d){return '<div class="h">'+d.slice(0,2)+'</div>';}).join(''));

    if(mobiel()) kap.forEach(function(k){

        h+='<div class="rk-dag'+(r.length?'':' vrijdag')+'"><b>'+DAGEN[d].slice(0,2)+'</b><div class="rk-blokken">'+(r.length?blokjes(r):'<span class="rk-vrij">Vrij</span>')+'</div><button class="plus" data-k="'+k.id+'" data-d="'+d+'" aria-label="Werktijd toevoegen op '+DAGEN[d]+'">+</button></div>';

      '<div class="rij2"><label class="veld">Kapper<select name="kapper">'+kapperOpties(mijnKapper||(kap[0]||{}).id,true)+'</select></label><label class="veld">Datum<input type="date" name="datum" required value="'+isoDag(plus(new Date(),1))+'"></label></div>'+
      '<label class="veld">Soort<select name="soort"><option value="vrij">Hele dag vrij</option><option value="anders">Andere werktijden</option></select></label>'+
      '<div class="rij3" id="afwtijden" hidden><label class="veld">Van<input type="time" name="van" value="10:00"></label><label class="veld">Tot<input type="time" name="tot" value="14:00"></label><span></span></div>'+
      '<label class="veld">Reden (optioneel)<input name="reden" maxlength="60" placeholder="Vakantie, cursus…"></label><button class="knop">Toevoegen</button></form></div>'+
      '<div class="kaart"><h2 class="kop" style="font-size:18px;margin-bottom:10px">Gepland</h2><div id="afwlijst"></div></div></div>';

    $('afwlijst').innerHTML=afw.length?'<table class="kaarttabel afwtabel"><tbody>'+afw.map(function(a){var k=kapper(a.kapper_id)||{};return '<tr><td><span class="stip" style="background:'+esc(k.kleur)+'"></span>'+esc(k.naam)+'</td><td>'+datumLang(vanIso(a.datum))+'</td><td>'+(a.vrij?'Vrij':String(a.van).slice(0,5)+'–'+String(a.tot).slice(0,5))+(a.reden?' <small style="color:var(--zacht)">· '+esc(a.reden)+'</small>':'')+'</td><td style="text-align:right"><button class="knop grijs klein" data-afwis="'+a.id+'">Weg</button></td></tr>';}).join('')+'</tbody></table>':'<p style="color:var(--zacht)">Nog niets gepland.</p>';
    var fa=$('afwf'); fa.soort.addEventListener('change',function(){$('afwtijden').hidden=fa.soort.value==='vrij';});
    fa.addEventListener('submit',function(e){
      e.preventDefault(); var vrij=fa.soort.value==='vrij';
      var bestaand=D.afwijkingen.filter(function(a){return a.kapper_id===fa.kapper.value&&a.datum===fa.datum.value;})[0];

    });
    p.querySelectorAll('[data-afwis]').forEach(function(b){b.addEventListener('click',function(){verwijder('afwijkingen',b.dataset.afwis).then(function(){melding('Verwijderd');toonRooster();}).catch(function(err){melding(err.message,true);});});});
    p.querySelectorAll('.plus').forEach(function(b){b.addEventListener('click',function(){
      var bestaand=D.rooster.filter(function(x){return x.kapper_id===b.dataset.k&&x.weekdag===+b.dataset.d;}).sort(function(a,c){return minuten(c.tot)-minuten(a.tot);})[0];
      var van=bestaand?tijdStr(Math.min(minuten(bestaand.tot)+60,22*60)):'10:00', tot=bestaand?tijdStr(Math.min(minuten(van)+120,23*60)):'18:00';
      opslaan('rooster',{kapper_id:b.dataset.k,weekdag:+b.dataset.d,van:van,tot:tot}).then(function(){melding('Werktijd toegevoegd');toonRooster();}).catch(function(err){melding(err.message,true);});
    });});
    p.querySelectorAll('[data-wis]').forEach(function(b){b.addEventListener('click',function(){verwijder('rooster',b.dataset.wis).then(function(){melding('Verwijderd');toonRooster();}).catch(function(err){melding(err.message,true);});});});
    p.querySelectorAll('.blokje input').forEach(function(inp){inp.addEventListener('change',function(){
      var bl=inp.closest('.blokje'), id=bl.dataset.id, van=bl.querySelector('[data-veld=van]').value, tot=bl.querySelector('[data-veld=tot]').value;
      if(!(minuten(tot)>minuten(van))){melding('De eindtijd moet na de begintijd liggen.',true);return;}
      opslaan('rooster',{id:id,van:van,tot:tot}).then(function(){melding('Rooster bijgewerkt');}).catch(function(err){melding(err.message,true);});
    });});
  }

  function kapperModal(k){
    var kleur=k?k.kleur:KLEUREN[D.kappers.length%KLEUREN.length];
    openModal('<h2 class="kop">'+(k?'Kapper bewerken':'Nieuwe kapper')+'<button class="ikoon" data-sluit aria-label="Sluiten">✕</button></h2><form id="kf">'+
      '<label class="veld">Naam<input name="naam" required maxlength="60" value="'+esc(k?k.naam:'')+'"></label>'+
      '<label class="veld">Korte omschrijving (op de website)<input name="bio" maxlength="80" value="'+esc(k?k.bio||'':'')+'" placeholder="Bijvoorbeeld: fades, baard en harsen"></label>'+
      '<div class="veld" style="font-size:12.5px;color:var(--zacht)">Foto (komt op de website bij deze kapper)<div class="fotokies"><div class="fotovoorbeeld" id="fvb" style="background:'+esc(kleur)+'"></div><div class="knoppen"><label class="knop grijs klein">'+(k&&k.foto?'Andere foto':'Foto kiezen')+'<input type="file" id="fbestand" accept="image/*" hidden></label><button type="button" class="knop grijs klein" id="fweg"'+(k&&k.foto?'':' hidden')+'>Foto weghalen</button><small>Wordt rond uitgesneden.</small></div></div></div>'+
      '<label class="veld">Rol<select name="rol"><option value="kapper">Kapper</option><option value="eigenaar"'+(k&&k.rol==='eigenaar'?' selected':'')+'>Eigenaar (mag alles beheren)</option></select></label>'+
      '<div class="veld" style="font-size:12.5px;color:var(--zacht)">Kleur in de agenda<div class="kleuren" id="kleuren">'+KLEUREN.map(function(c){return '<button type="button" data-c="'+c+'" style="background:'+c+'" aria-pressed="'+(c===kleur)+'"></button>';}).join('')+'</div></div>'+
      (k?'<div class="schakel"><span>Actief (uit = verdwijnt uit agenda en website)</span><input type="checkbox" name="actief"'+(k.actief?' checked':'')+'></div>':'')+
      '<div class="acties"><div>'+(k&&!k.user_id?'<button type="button" class="knop rood" id="kwis">Verwijderen</button>':'')+'</div><div><button type="button" class="knop grijs" data-sluit>Annuleren</button><button class="knop">Opslaan</button></div></div></form>');
    var fotoBlob=null, fotoWeg=false, oudeFoto=k?k.foto:null, voorbeeldUrl=null;
    function toonVoorbeeld(){
      var v=$('fvb'), src=fotoBlob?voorbeeldUrl:(fotoWeg?null:oudeFoto);
      v.innerHTML=src?'<img src="'+esc(src)+'" alt="">':esc(($('kf').naam.value||'?').charAt(0).toUpperCase());
      v.style.background=kleur; $('fweg').hidden=!src;
    }
    toonVoorbeeld();
    $('kf').naam.addEventListener('input',function(){if(!fotoBlob&&(fotoWeg||!oudeFoto)) toonVoorbeeld();});
    $('fbestand').addEventListener('change',function(e){
      var b=e.target.files&&e.target.files[0]; if(!b) return;
      maakFoto(b).then(function(blob){fotoBlob=blob;fotoWeg=false;if(voorbeeldUrl) URL.revokeObjectURL(voorbeeldUrl);voorbeeldUrl=URL.createObjectURL(blob);toonVoorbeeld();})
        .catch(function(err){melding(err.message,true);}); e.target.value='';
    });
    $('fweg').addEventListener('click',function(){fotoBlob=null;fotoWeg=true;toonVoorbeeld();});
    $('kleuren').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b) return;kleur=b.dataset.c;$('kleuren').querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});toonVoorbeeld();});
    $('kf').addEventListener('submit',function(e){
      e.preventDefault(); var f=e.target, knop=f.querySelector('button.knop:not(.grijs):not(.rood)'); knop.disabled=true;
      var rij={id:k?k.id:undefined,naam:f.naam.value.trim(),bio:f.bio.value.trim()||null,rol:f.rol.value,kleur:kleur};
      if(k) rij.actief=f.actief.checked; else {rij.volgorde=D.kappers.length+1;}
      (fotoBlob?uploadFoto(fotoBlob):Promise.resolve(fotoWeg?null:undefined)).then(function(url){
        if(url!==undefined) rij.foto=url;
        return opslaan('kappers',rij);
      }).then(function(nk){
        if(rij.foto!==undefined&&oudeFoto&&oudeFoto!==rij.foto) verwijderFoto(oudeFoto);
        sluitModal(); melding('Opgeslagen');
        if(!k){ // standaardrooster: di t/m za 9-17:30, vrijdag tot 18:30
          var p=[];for(var d=1;d<=5;d++) p.push(opslaan('rooster',{kapper_id:nk.id,weekdag:d,van:'09:00',tot:d===4?'18:30':'17:30'}));
          Promise.all(p).then(toonTeam);

      verwijder('kappers',k.id).then(function(){verwijderFoto(k.foto);sluitModal();melding('Verwijderd');toonTeam();}).catch(function(){melding('Deze kapper heeft nog afspraken. Zet hem op inactief in plaats van verwijderen.',true);}); });
  }

        if(tab==='team') toonTeam();

      D.diensten.map(function(d){return '<tr><td><b>'+esc(d.naam)+'</b><br><small style="color:var(--zacht)">'+esc(d.omschrijving||'')+'</small></td><td>'+d.duur+' min</td><td>'+euro(d.prijs)+'</td><td>'+(d.actief?'Ja':'Nee')+'</td><td style="text-align:right"><button class="knop grijs klein" data-d="'+d.id+'">Bewerken</button></td></tr>';}).join('')+'</tbody></table></div>';
    $('nieuwdienst').addEventListener('click',function(){dienstModal(null);});
    p.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){dienstModal(dienst(b.dataset.d));});});
  }
  function dienstModal(d){
    openModal('<h2 class="kop">'+(d?'Behandeling bewerken':'Nieuwe behandeling')+'<button class="ikoon" data-sluit aria-label="Sluiten">✕</button></h2><form id="df">'+
      '<label class="veld">Naam<input name="naam" required maxlength="60" value="'+esc(d?d.naam:'')+'"></label>'+
      '<label class="veld">Omschrijving<input name="oms" maxlength="120" value="'+esc(d?d.omschrijving||'':'')+'"></label>'+
      '<div class="rij2"><label class="veld">Duur (min)<input name="duur" type="number" min="5" max="480" step="5" required value="'+(d?d.duur:40)+'"></label><label class="veld">Prijs (€)<input name="prijs" type="number" min="0" step="0.5" required value="'+(d?d.prijs:35)+'"></label></div>'+
      '<div class="schakel"><span>Online te boeken</span><input type="checkbox" name="actief"'+(!d||d.actief?' checked':'')+'></div>'+
      '<div class="acties"><div>'+(d?'<button type="button" class="knop rood" id="dwis">Verwijderen</button>':'')+'</div><div><button type="button" class="knop grijs" data-sluit>Annuleren</button><button class="knop">Opslaan</button></div></div></form>');
    $('df').addEventListener('submit',function(e){e.preventDefault();var f=e.target;
      opslaan('diensten',{id:d?d.id:undefined,naam:f.naam.value.trim(),omschrijving:f.oms.value.trim()||null,duur:+f.duur.value,prijs:+f.prijs.value,actief:f.actief.checked,volgorde:d?d.volgorde:D.diensten.length+1})
        .then(function(){sluitModal();melding('Opgeslagen');toonDiensten();}).catch(function(err){melding(err.message,true);});});
    if($('dwis')) $('dwis').addEventListener('click',function(){ if(!confirm('Behandeling verwijderen?')) return; verwijder('diensten',d.id).then(function(){sluitModal();melding('Verwijderd');toonDiensten();}).catch(function(err){melding(err.message,true);}); });
  }

  /* ---------- Instellingen ---------- */
  function toonInstellingen(){
    var p=$('pagina'), ins=(zaak&&zaak.instellingen)||{}, ot=ins.openingstijden||[], eig=rol==='eigenaar', dis=eig?'':' disabled';
    p.innerHTML='<div class="paginakop"><h1 class="kop">Instellingen</h1></div><div class="grid2">'+
      '<div class="kaart"><h2 class="kop" style="font-size:18px;margin-bottom:12px">Online boeken</h2><form id="if" style="display:grid;gap:12px">'+
      '<label class="veld">Tijdslot (minuten tussen starttijden)<select name="slot"'+dis+'>'+[10,15,20,30,40,45,60].map(function(n){return '<option'+((ins.slot||15)===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></label>'+
      '<label class="veld">Minimaal vooraf boeken (uren)<input type="number" name="vooraf" min="0" max="72" step="0.5" value="'+(ins.minVooraf==null?1:ins.minVooraf)+'"'+dis+'></label>'+
      '<label class="veld">Zo ver vooruit boeken (dagen)<input type="number" name="vooruit" min="1" max="120" value="'+(ins.vooruit||42)+'"'+dis+'></label>'+
      '<h3 class="kop" style="font-size:15px;margin-top:6px">Openingstijden op de website</h3>'+
      DAGEN.map(function(d,i){var o=ot[i]||{};return '<div class="rij3" style="align-items:center"><span>'+d+'</span><input type="time" name="o'+i+'" value="'+(o.open||'')+'"'+dis+'><input type="time" name="d'+i+'" value="'+(o.dicht||'')+'"'+dis+'></div>';}).join('')+
      '<small style="color:var(--zacht)">Laat beide leeg voor gesloten.</small>'+(eig?'<button class="knop">Opslaan</button>':'')+'</form></div>'+
      '<div class="kaart"><h2 class="kop" style="font-size:18px;margin-bottom:12px">Je account</h2>'+
      (demo?'<p style="color:var(--zacht)">In de voorbeeldomgeving kun je je wachtwoord niet wijzigen.</p>':rol==='eigenaar'&&!mijnKapper?'<p style="color:var(--zacht)">Je logt in met je Flowsmid-account. Je wachtwoord wijzig je in Mijn Flowsmid.</p>':
       '<form id="eigenww" style="display:grid;gap:10px"><label class="veld">Nieuw wachtwoord<input type="password" name="ww" minlength="8" required autocomplete="new-password"></label><label class="veld">Herhaal<input type="password" name="ww2" minlength="8" required autocomplete="new-password"></label><button class="knop">Wachtwoord wijzigen</button></form>')+
      '<div style="height:18px"></div><a class="knop grijs" href="/" target="_blank" rel="noopener">Website bekijken</a></div></div>';
    if(eig) $('if').addEventListener('submit',function(e){
      e.preventDefault(); var f=e.target, o=[];
      for(var i=0;i<7;i++){var a=f['o'+i].value,b=f['d'+i].value;o.push(a&&b?{open:a,dicht:b}:{gesloten:true});}
      var nieuw=Object.assign({},ins,{slot:+f.slot.value,minVooraf:+f.vooraf.value,vooruit:+f.vooruit.value,openingstijden:o});
      (demo?Promise.resolve():api('kb_zaken?klant_id=eq.'+zaak.klant_id,{methode:'PATCH',body:{instellingen:nieuw,bijgewerkt_op:new Date().toISOString()}}))
        .then(function(){zaak.instellingen=nieuw;melding('Instellingen opgeslagen');}).catch(function(err){melding(err.message,true);});
    });
    if($('eigenww')) $('eigenww').addEventListener('submit',function(e){
      e.preventDefault(); var f=e.target; if(f.ww.value!==f.ww2.value){melding('De wachtwoorden zijn niet gelijk.',true);return;}
      functie({actie:'eigen_wachtwoord',wachtwoord:f.ww.value}).then(function(){f.reset();melding('Wachtwoord gewijzigd');}).catch(function(err){melding(err.message,true);});
    });
  }

  /* ---------- Voorbeelddata ---------- */
  function voorbeeld(){
    var o={open:'09:00',dicht:'17:30'};
    zaak={klant_id:'demo',naam:'Barbershop Ocean',instellingen:{slot:15,minVooraf:1,vooruit:42,openingstijden:[{gesloten:true},o,o,o,{open:'09:00',dicht:'18:30'},o,{gesloten:true}]}};
    rol='eigenaar'; mijnKapper=null;
    D.kappers=[{id:'k1',naam:'Ocean',bio:'Fades, baard en harsen.',kleur:'#1fa2c4',rol:'eigenaar',actief:true,online_boekbaar:true,gebruikersnaam:'ocean',user_id:'demo'},
      {id:'k2',naam:'Sara',bio:'Dames, kleuren en beauty.',kleur:'#e0625b',rol:'kapper',actief:true,online_boekbaar:true,gebruikersnaam:null,user_id:null}];
    D.diensten=[{id:'d1',naam:'Heren knippen',omschrijving:'Heren · Fade, taper of klassiek, strak afgewerkt.',prijs:25,duur:30,actief:true,volgorde:1},
      {id:'d2',naam:'Knippen en scheren',omschrijving:'Heren · Knipbeurt met de baard in model geschoren.',prijs:35,duur:45,actief:true,volgorde:2},
      {id:'d3',naam:'Kinderen tot en met 11 jaar',omschrijving:'Kids · Rustig en vakkundig geknipt.',prijs:20,duur:30,actief:true,volgorde:3},
      {id:'d4',naam:'Dames kort haar knippen',omschrijving:'Dames · Vanaf-prijs.',prijs:27,duur:30,actief:true,volgorde:4},
      {id:'d5',naam:'Wenkbrauwen epileren',omschrijving:'Beauty · Netjes in model.',prijs:10,duur:15,actief:true,volgorde:5}];
    D.rooster=[];[['k1',[1,2,3,4,5]],['k2',[1,2,4,5]]].forEach(function(x){x[1].forEach(function(d){D.rooster.push({id:uuid(),kapper_id:x[0],weekdag:d,van:'09:00',tot:d===4?'18:30':'17:30'});});});
    D.afwijkingen=[{id:uuid(),kapper_id:'k2',datum:isoDag(plus(maandag(new Date()),12)),vrij:true,reden:'Vrije dag'}];
    D.blokkades=[];D.afspraken=[];
    var namen=['Ryan','Mohamed','Kevin','Daan','Yassin','Jayden','Milan','Sem','Noah','Ilias','Bilal','Luuk','Dylan','Omar','Thijs','Jordy','Ayoub','Rayan','Levi','Stefan'];
    for(var i=-7;i<21;i++){
      var dag=plus(startDag(new Date()),i);
      if(wd(dag)>=1&&wd(dag)<=5){ var b=new Date(dag);b.setHours(12,30,0,0); D.blokkades.push({id:uuid(),kapper_id:'k1',start:b.toISOString(),eind:new Date(b.getTime()+30*6e4).toISOString(),reden:'Lunch'}); }
      for(var j=0;j<10;j++){
        var kid=['k1','k2'][j%2]; if(!werkRamen(kid,dag).length) continue;
        var m=540+30*((j*5+dag.getDate())%16), s=new Date(dag);s.setHours(0,m,0,0);
        var d=D.diensten[kid==='k1'?(j+dag.getDate())%3:3+(j+dag.getDate())%2], e=new Date(s.getTime()+d.duur*6e4);
        if(D.afspraken.some(function(a){return a.kapper_id===kid&&new Date(a.start)<e&&new Date(a.eind)>s;})||D.blokkades.some(function(x){return x.kapper_id===kid&&new Date(x.start)<e&&new Date(x.eind)>s;})) continue;
        D.afspraken.push({id:uuid(),kapper_id:kid,dienst_id:d.id,dienst:d.naam,prijs:d.prijs,start:s.toISOString(),eind:e.toISOString(),naam:namen[(j*3+dag.getDate())%20]+' '+'ABDJKLMSV'.charAt(j%9)+'.',telefoon:'06 1234 56'+pad((j*7+dag.getDate())%100),
          status:s<new Date()?(j%7===0?'Niet verschenen':'Voltooid'):'Bevestigd',bron:j%3===0?'online':'portaal'});
      }
    }
  }
})();
