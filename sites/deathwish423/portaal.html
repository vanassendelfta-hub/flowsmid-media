<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members | Deathwish Brotherhood</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070505">
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --zwart:#070505; --kool:#0f0b0a; --kaart:#141010; --kaart2:#1a1413; --lijn:#2c2220;
  --rood:#d8261a; --oranje:#ff6a13; --tekst:#ece7e4; --zacht:#a89f9a; --ok:#7bd88f; --fout:#ff6b5e;
  --vuur:linear-gradient(180deg,#ffb23a 0%,#ff6a13 38%,#d8261a 72%,#8e0f0a 100%);
  --zilverrand:linear-gradient(135deg,#f4f5f6 0%,#8d9399 22%,#e6e8ea 45%,#6f757b 70%,#d9dcdf 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:radial-gradient(ellipse 80% 50% at 50% 0%,#2a0906 0%,var(--zwart) 60%) fixed,var(--zwart);color:var(--tekst);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100svh}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.rye{font-family:Rye,Georgia,serif;font-weight:400}
.vuurtekst{background:var(--vuur);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{font:600 11px/1 Oswald,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--oranje)}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:4px;
  font:600 14px/1 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,#ff7a1f,#c8200f);box-shadow:0 0 0 1.5px #e9ebee inset,0 0 0 3px #2a2a2a inset;transition:transform .15s,opacity .15s}
.knop:hover{transform:translateY(-1px)}
.knop:disabled{opacity:.45;cursor:not-allowed;transform:none}
.knop.lijn{background:rgba(0,0,0,.3);box-shadow:0 0 0 1.5px #8d9399 inset}
.knop.klein{height:34px;padding:0 12px;font-size:12px}
.knop.gevaar{background:rgba(0,0,0,.3);box-shadow:0 0 0 1.5px #b23a2f inset;color:#ff9c90}
.linkje{color:var(--zacht);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkje:hover{color:#fff}
.verborgen{display:none!important}

/* Formulieren */
label.veld{display:block;margin-bottom:14px}
label.veld>span{display:block;font:600 12px/1 Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#cfc7c3;margin-bottom:7px}
input[type=text],input[type=password],input[type=datetime-local],textarea{width:100%;background:#0b0808;border:1px solid #3a2e2b;border-radius:4px;padding:11px 12px;color:#fff;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--oranje)}
textarea{resize:vertical;min-height:90px}
.vink{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;margin:6px 0;font-size:14px}
.vink input{width:18px;height:18px;accent-color:var(--oranje)}
.hint{color:var(--zacht);font-size:13px}
.fouttekst{color:var(--fout);font-size:14px;min-height:20px;margin-top:6px}

/* Kader zoals patches */
.kader{border-radius:6px;padding:2px;background:var(--zilverrand)}
.kader>.binnen{border-radius:4px;background:linear-gradient(180deg,#140e0d,#0b0808)}

/* Login */
#login{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
#login .kader{width:min(100%,400px)}
#login .binnen{padding:30px 26px 26px;text-align:center}
#login img.schild{width:92px;margin:0 auto 12px;filter:drop-shadow(0 0 20px rgba(255,80,20,.35))}
#login h1{font-size:28px;line-height:1.1;margin:8px 0 4px}
#login p.sub{color:var(--zacht);font-size:14px;margin-bottom:22px}
#login form{text-align:left}
#login .knop{width:100%;margin-top:4px}
#login .onder{margin-top:18px;text-align:center;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* App */
#app header{position:sticky;top:0;z-index:20;background:rgba(7,5,5,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #241b19}
#app header .rij{max-width:980px;margin:0 auto;padding:0 16px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#app header .merk{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
#app header .merk img{height:38px;width:auto}
#app header .merk b{font-family:Rye,serif;font-weight:400;font-size:17px;white-space:nowrap}
#app header .merk small{display:block;font:600 10px/1 Oswald,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--zacht);margin-top:3px}
#app header .rechts{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--zacht)}
#app header .wie{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:12px 14px;font:600 13px/1 Oswald,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a99f9a;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.aan{color:#fff;border-bottom-color:var(--oranje)}
main{max-width:980px;margin:0 auto;padding:26px 16px 80px}
.kopje{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.kopje h2{font-family:Rye,serif;font-weight:400;font-size:clamp(24px,4vw,32px);line-height:1.1}
.leeg{padding:34px 20px;text-align:center;color:var(--zacht);border:1px dashed #3a2e2b;border-radius:6px}

/* Kaarten */
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:6px;padding:16px 16px 14px;margin-bottom:14px}
.kaart .meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 Oswald,sans-serif;background:linear-gradient(180deg,#ff7a1f,#a3180c);color:#fff;flex:none;box-shadow:0 0 0 1.5px #c9ccd0}
.kaart .naam{font-weight:600;color:#fff}
.kaart .tijd{color:var(--zacht);font-size:12.5px}
.kaart .tekst{white-space:pre-wrap;word-wrap:break-word}
.acties{display:flex;gap:12px;margin-left:auto}
.acties button{color:var(--zacht);font-size:12.5px}
.acties button:hover{color:#fff}
.reacties{margin-top:12px;padding-top:10px;border-top:1px solid #241b19;display:grid;gap:10px}
.reactie{display:flex;gap:10px}
.reactie .avatar{width:26px;height:26px;font-size:11px}
.reactie .bol{background:var(--kaart2);border-radius:6px;padding:8px 11px;flex:1;min-width:0}
.reactie .bol .kop{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.reactie .bol .tekst{font-size:14px}
.reageer{display:flex;gap:8px;margin-top:10px}
.reageer input{flex:1;min-width:0;padding:9px 11px}
.nieuwpost textarea{min-height:80px}
.nieuwpost .rij{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* Events */
.event{display:grid;grid-template-columns:74px 1fr;gap:16px;align-items:start}
.datumblok{border-radius:5px;padding:2px;background:var(--zilverrand);text-align:center}
.datumblok div{background:#0b0808;border-radius:4px;padding:8px 4px}
.datumblok .d{font-family:Rye,serif;font-size:28px;line-height:1}
.datumblok .m{font:600 11px/1 Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--oranje);margin-top:4px}
.event h3{font-family:Rye,serif;font-weight:400;font-size:20px;line-height:1.2;margin-bottom:4px}
.event .info{color:var(--zacht);font-size:13.5px;margin-bottom:6px}
.badge{display:inline-block;font:600 10.5px/1 Oswald,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:5px 8px;border-radius:3px;vertical-align:middle}
.badge.open{background:rgba(123,216,143,.12);color:var(--ok);box-shadow:0 0 0 1px rgba(123,216,143,.35) inset}
.badge.dicht{background:rgba(255,106,19,.12);color:#ffad7a;box-shadow:0 0 0 1px rgba(255,106,19,.4) inset}
.badge.grijs{background:rgba(255,255,255,.06);color:#bbb;box-shadow:0 0 0 1px #3a3a3a inset}
details.verleden summary{cursor:pointer;color:var(--zacht);margin:18px 0 12px;font-size:14px}

/* Leden-tabel */
.lid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.lid .rechten{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.lid .rechten .vink{margin:0;font-size:13px}
.lid .knoppen{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lid.uit{opacity:.55}
@media (max-width:640px){.lid{grid-template-columns:1fr}.lid .knoppen{justify-content:flex-start}}
.ledenlijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ledenlijst .kaart{display:flex;gap:12px;align-items:center;margin:0}

/* Modal en melding */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .kader{width:min(100%,520px);max-height:calc(100svh - 32px);display:flex}
.modal .binnen{padding:22px 20px;overflow:auto;width:100%}
.modal h3{font-family:Rye,serif;font-weight:400;font-size:24px;margin-bottom:16px}
.modal .knoppen{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;flex-wrap:wrap}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.twee{grid-template-columns:1fr}}
.melding{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;z-index:80;background:#1d1514;border:1px solid #4a3a36;border-radius:6px;padding:11px 16px;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px)}
.melding.zicht{opacity:1;transform:translate(-50%,0)}
.melding.fout{border-color:#8a2f27;color:#ffb3aa}
.wwvak{font:600 18px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;background:#0b0808;border:1px dashed #6a5a55;border-radius:4px;padding:12px;text-align:center;margin:10px 0;user-select:all}
</style>
</head>
<body>

<!-- ============ Inloggen ============ -->
<section id="login">
  <div class="kader"><div class="binnen">
    <img class="schild" src="/img/deel-schild.webp" alt="">
    <span class="label" id="l-label">Members only</span>
    <h1 class="rye vuurtekst" id="l-titel">Members login</h1>
    <p class="sub" id="l-sub">Log in met de naam en het wachtwoord die je van de club hebt gekregen.</p>
    <form id="loginform" autocomplete="on">
      <label class="veld"><span>Gebruikersnaam</span><input type="text" id="l-naam" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="veld"><span>Wachtwoord</span><input type="password" id="l-ww" autocomplete="current-password" required></label>
      <button class="knop" id="loginknop" type="submit">Inloggen</button>
      <div class="fouttekst" id="loginfout"></div>
    </form>
    <div class="onder"><a class="linkje" href="/">Terug naar de homepage</a><a class="linkje" id="l-wissel" href="/beheer">Beheer</a></div>
  </div></div>
</section>

<!-- ============ App ============ -->
<div id="app" class="verborgen">
  <header>
    <div class="rij">
      <a class="merk" href="/"><img src="/img/deel-schild.webp" alt=""><div><b class="vuurtekst">Deathwish</b><small id="modus">Members</small></div></a>
      <div class="rechts"><span class="wie" id="wie"></span><a class="linkje verborgen" id="naarbeheer" href="/beheer">Beheer</a><button class="linkje" id="uitknop" type="button">Uitloggen</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="inhoud"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="kader"><div class="binnen" id="modaldoos"></div></div></div>
<div class="melding" id="melding" role="status"></div>

<script>
(function(){
  'use strict';
  var SUPA='https://uywydquzvdbpfjjrwsbt.supabase.co', KEY='sb_publishable_J1Ewyl4he9-KRj_jv8fIPA_S8vZ2v5_', SLUG='deathwish423';
  var BEHEER=/^\/beheer/.test(location.pathname);
  var OPSLAG='deathwish-'+(BEHEER?'beheer':'leden')+'-sessie';
  var MAANDEN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  var MAANDEN_LANG=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
  var DAGEN=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
  var $=function(id){return document.getElementById(id);};
  var sessie=null, club=null, rol=null, ik=null, tab=null;
  var D={posts:[],reacties:[],events:[],leden:[],mededelingen:[]};

  /* ---------- hulp ---------- */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pad(n){return (n<10?'0':'')+n;}
  function tijd(d){d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes());}
  function datum(d){d=new Date(d);return DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN_LANG[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
  function geleden(d){
    var s=(Date.now()-new Date(d))/1000;
    if(s<60) return 'zojuist'; if(s<3600) return Math.floor(s/60)+' min geleden'; if(s<86400) return Math.floor(s/3600)+' uur geleden';
    if(s<86400*6) return Math.floor(s/86400)+(Math.floor(s/86400)===1?' dag':' dagen')+' geleden';
    return datum(d);
  }
  function lokaal(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
  function letter(n){return esc(String(n||'?').trim().charAt(0).toUpperCase()||'?');}
  function melding(t,fout){var m=$('melding');m.textContent=t;m.classList.toggle('fout',!!fout);m.classList.add('zicht');clearTimeout(melding.t);melding.t=setTimeout(function(){m.classList.remove('zicht');},2800);}
  function eigenaar(){return rol==='eigenaar';}
  function recht(r){if(eigenaar()) return true; return !!(ik&&ik[r]);}
  function maakWachtwoord(){var t='abcdefghjkmnpqrstuvwxyz23456789',s='';var a=new Uint32Array(10);crypto.getRandomValues(a);for(var i=0;i<10;i++){s+=t[a[i]%t.length];if(i===4)s+='-';}return s;}
  function slugNaam(n){return String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'').slice(0,30);}

  /* ---------- Supabase ---------- */
  function bewaar(s){sessie=s;try{sessionStorage.setItem(OPSLAG,JSON.stringify(s));}catch(e){}}
  function auth(body,grant){
    return fetch(SUPA+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok) throw new Error('x'); return j;});})
      .then(function(j){bewaar({token:j.access_token,refresh:j.refresh_token,verloopt:Date.now()+(j.expires_in-60)*1000});return sessie;});
  }
  function geldig(){ if(!sessie) return Promise.reject(new Error('Niet ingelogd')); if(Date.now()<sessie.verloopt) return Promise.resolve(); return auth({refresh_token:sessie.refresh},'refresh_token').catch(function(){uitloggen();throw new Error('Sessie verlopen, log opnieuw in.');}); }
  function api(pad,o){
    o=o||{};
    return geldig().then(function(){
      var h={apikey:KEY,Authorization:'Bearer '+sessie.token,'Accept-Profile':'flowsmid','Content-Profile':'flowsmid','Content-Type':'application/json'};
      if(o.terug) h.Prefer='return=representation';
      return fetch(SUPA+'/rest/v1/'+pad,{method:o.methode||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
    }).then(function(r){ if(r.status===401){uitloggen();throw new Error('Sessie verlopen, log opnieuw in.');}
      return r.text().then(function(t){var j=t?JSON.parse(t):null; if(!r.ok) throw new Error(vertaal(j)); return j;}); });
  }
  function vertaal(j){var m=j&&j.message||''; if(/row-level security|permission denied/i.test(m)) return 'Je hebt hier geen rechten voor.'; return m||'Er ging iets mis.';}
  function functie(body){
    return geldig().then(function(){return fetch(SUPA+'/functions/v1/mc-account',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sessie.token,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({slug:SLUG},body))});})
      .then(function(r){return r.json().then(function(j){if(!r.ok) throw new Error(j.fout||'Er ging iets mis'); return j;});});
  }

  /* ---------- Inloggen ---------- */
  if(BEHEER){
    document.title='Beheer | Deathwish Brotherhood';
    $('l-label').textContent='Beheer'; $('l-titel').textContent='Beheer';
    $('l-sub').textContent='Log in met je Flowsmid-account om leden, events en de homepage te beheren.';
    $('l-wissel').textContent='Members login'; $('l-wissel').href='/leden';
    $('modus').textContent='Beheer';
  }
  $('loginform').addEventListener('submit',function(e){
    e.preventDefault();
    var naam=$('l-naam').value.trim().toLowerCase(), ww=$('l-ww').value, knop=$('loginknop');
    if(!naam||!ww) return;
    knop.disabled=true;knop.textContent='Bezig…';$('loginfout').textContent='';
    sessie=null;
    var lid=naam+'@'+SLUG+'.lid.flowsmid.nl', fs=naam+'@login.flowsmid.nl';
    var pogingen=naam.indexOf('@')>-1?[naam]:(BEHEER?[fs,lid]:[lid,fs]);
    (function probeer(i){
      if(i>=pogingen.length) return Promise.reject(new Error('x'));
      return auth({email:pogingen[i],password:ww},'password').catch(function(){return probeer(i+1);});
    })(0).then(function(){return start();})
      .catch(function(err){sessie=null;try{sessionStorage.removeItem(OPSLAG);}catch(x){}$('loginfout').textContent=err&&err.message&&err.message!=='x'?err.message:'Gebruikersnaam of wachtwoord klopt niet.';})
      .then(function(){knop.disabled=false;knop.textContent='Inloggen';});
  });
  $('uitknop').addEventListener('click',uitloggen);
  function uitloggen(){
    if(sessie) fetch(SUPA+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sessie.token}}).catch(function(){});
    sessie=null;club=null;rol=null;ik=null;try{sessionStorage.removeItem(OPSLAG);}catch(e){}
    $('app').classList.add('verborgen');$('login').classList.remove('verborgen');$('l-ww').value='';sluit();
  }
  function start(){
    return api('rpc/mc_mijn_club',{methode:'POST',body:{p_slug:SLUG}}).then(function(z){
      if(!z) throw new Error('Dit account heeft geen toegang tot Deathwish Brotherhood.');
      if(BEHEER&&z.rol!=='eigenaar') throw new Error('Alleen de eigenaar kan het beheer openen. Gebruik de members login.');
      club=z; rol=z.rol; ik=z.lid;
      $('wie').textContent=ik?ik.naam:(eigenaar()?'Eigenaar':'');
      $('naarbeheer').classList.toggle('verborgen',BEHEER||!eigenaar());
      if(BEHEER){$('naarbeheer').classList.add('verborgen');}
      $('login').classList.add('verborgen');$('app').classList.remove('verborgen');
      bouwTabs();
    });
  }

  /* ---------- Tabs ---------- */
  var TABS_LEDEN=[['prikbord','Prikbord'],['events','Events'],['leden','Members'],['account','Mijn account']];
  var TABS_BEHEER=[['beheer-leden','Members'],['events','Events'],['homepage','Homepage'],['prikbord','Prikbord']];
  function bouwTabs(){
    var t=BEHEER?TABS_BEHEER:TABS_LEDEN;
    $('tabs').innerHTML=t.map(function(x){return '<button type="button" data-tab="'+x[0]+'">'+x[1]+'</button>';}).join('');
    var gewenst=(location.hash||'').slice(1); if(!t.some(function(x){return x[0]===gewenst;})) gewenst=t[0][0];
    kies(gewenst);
  }
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]'); if(b) kies(b.dataset.tab);});
  function kies(t){
    tab=t; history.replaceState(null,'','#'+t);
    [].forEach.call($('tabs').children,function(b){b.classList.toggle('aan',b.dataset.tab===t);});
    $('inhoud').innerHTML='<div class="leeg">Laden…</div>';

          return '<div class="reactie"><div class="avatar">'+letter(r.auteur_naam)+'</div><div class="bol"><div class="kop"><b>'+esc(r.auteur_naam)+'</b><span class="tijd">'+esc(geleden(r.aangemaakt_op))+'</span>'+
            (magBeheren(r)?'<span class="acties"><button type="button" data-wegreactie="'+r.id+'">Verwijderen</button></span>':'')+'</div><div class="tekst">'+esc(r.tekst)+'</div></div></div>';

  function eventForm(e){

      '<div class="fouttekst" id="a-fout"></div><button class="knop" type="submit">Wijzigen</button></form></div>';
    $('inhoud').innerHTML=h;
    $('wwform').addEventListener('submit',function(e){
      e.preventDefault(); var a=$('a-ww1').value,b=$('a-ww2').value; $('a-fout').textContent='';
      if(a.length<8){$('a-fout').textContent='Minimaal 8 tekens.';return;}
      if(a!==b){$('a-fout').textContent='De wachtwoorden zijn niet gelijk.';return;}
      var k=this.querySelector('button'); k.disabled=true;
      functie({actie:'eigen_wachtwoord',wachtwoord:a}).then(function(){$('a-ww1').value='';$('a-ww2').value='';melding('Je wachtwoord is gewijzigd');})
        .catch(function(err){$('a-fout').textContent=err.message;}).then(function(){k.disabled=false;});
    });
  }

  /* ---------- Homepage-bericht ---------- */
  function laadHomepage(){
    return api('mc_mededelingen?select=*&klant_id=eq.'+club.klant_id+'&order=bijgewerkt_op.desc').then(function(r){D.mededelingen=r;toonHomepage();});
  }
  function toonHomepage(){
    var h='<div class="kopje"><div><span class="label">Beheer</span><h2 class="vuurtekst">Bericht op de homepage</h2></div><button class="knop" type="button" id="nieuwmed">Nieuw bericht</button></div>'+
      '<p class="hint" style="margin:-6px 0 16px">Zichtbare berichten staan bovenaan de homepage voor iedereen. Openbare events verschijnen daar vanzelf.</p>';
    h+=D.mededelingen.length?D.mededelingen.map(function(m){
      return '<div class="kaart"><div class="meta"><b class="rye" style="font-size:19px">'+esc(m.titel)+'</b><span class="badge '+(m.zichtbaar?'open">Zichtbaar':'grijs">Verborgen')+'</span><span class="tijd">'+esc(geleden(m.bijgewerkt_op))+'</span>'+
        '<div class="acties"><button type="button" data-med="'+m.id+'">Bewerken</button><button type="button" data-medweg="'+m.id+'">Verwijderen</button></div></div>'+(m.tekst?'<div class="tekst">'+esc(m.tekst)+'</div>':'')+'</div>';
    }).join(''):'<div class="leeg">Er staat nu geen bericht op de homepage.</div>';
    h+='<p style="margin-top:14px"><a class="linkje" href="/" target="_blank" rel="noopener">Bekijk de homepage</a></p>';
    var nu=club.intro||'rijder';
    h+='<div class="kopje" style="margin-top:30px"><div><span class="label">Beheer</span><h2 class="vuurtekst">Intro van de homepage</h2></div></div>'+
      '<p class="hint" style="margin:-6px 0 16px">Kies welke intro bezoekers zien als ze de homepage openen.</p>'+
      [['rijder','De rijder','Een member rijdt binnen op zijn motor, stapt af en laat zijn rug zien. Het embleem komt in 3D naar voren.'],
       ['opbouw','Logo-opbouw','Het embleem bouwt zich stuk voor stuk op tussen de vonken.']].map(function(i){
        return '<div class="kaart"><label class="vink" style="margin:0"><input type="radio" name="intro" value="'+i[0]+'"'+(nu===i[0]?' checked':'')+'> <b>'+i[1]+'</b>'+(nu===i[0]?' <span class="badge open">Actief</span>':'')+'</label>'+
          '<div class="tekst" style="margin:6px 0 0 28px">'+i[2]+' <a class="linkje" href="/?intro='+i[0]+'" target="_blank" rel="noopener">Bekijk</a></div></div>';
      }).join('');
    $('inhoud').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('input[name=intro]'),function(r){
      r.addEventListener('change',function(){
        var keuze=r.value;
        api('mc_clubs?klant_id=eq.'+club.klant_id,{methode:'PATCH',body:{intro:keuze},terug:true}).then(function(x){
          if(!x||!x.length) throw new Error('Opslaan lukte niet.');
          club.intro=keuze;toonHomepage();melding('Intro aangepast');
        }).catch(function(err){melding(err.message,true);toonHomepage();});
      });
    });
  }
  function medForm(m){
    var nieuw=!m; m=m||{titel:'',tekst:'',zichtbaar:true};
    open('<h3>'+(nieuw?'Nieuw bericht':'Bericht bewerken')+'</h3><form id="mf">'+
      '<label class="veld"><span>Titel</span><input type="text" id="h-titel" maxlength="120" required value="'+esc(m.titel)+'"></label>'+
      '<label class="veld"><span>Tekst</span><textarea id="h-tekst" maxlength="2000">'+esc(m.tekst||'')+'</textarea></label>'+
      '<label class="vink"><input type="checkbox" id="h-zicht"'+(m.zichtbaar?' checked':'')+'> Zichtbaar op de homepage</label>'+
      '<div class="fouttekst" id="m-fout"></div><div class="knoppen"><button class="knop lijn" type="button" data-sluit>Annuleren</button><button class="knop" type="submit">Opslaan</button></div></form>');
    $('mf').addEventListener('submit',function(e){e.preventDefault();
      var body={titel:$('h-titel').value.trim(),tekst:$('h-tekst').value.trim()||null,zichtbaar:$('h-zicht').checked};
      (nieuw?api('mc_mededelingen',{methode:'POST',body:Object.assign({klant_id:club.klant_id},body)}):api('mc_mededelingen?id=eq.'+m.id,{methode:'PATCH',body:body}))
        .then(function(){sluit();melding('Opgeslagen');return laadHomepage();}).catch(function(err){$('m-fout').textContent=err.message;});});
  }
  function medVerwijderen(id){
    confirm2('Dit bericht van de homepage verwijderen?',function(){api('mc_mededelingen?id=eq.'+id,{methode:'DELETE'}).then(function(){melding('Verwijderd');return laadHomepage();}).catch(function(err){melding(err.message,true);});});
  }

  /* ---------- Modal ---------- */
  function open(html){$('modaldoos').innerHTML=html;$('modal').classList.add('open');var f=$('modaldoos').querySelector('input,textarea');if(f&&!('ontouchstart' in window))f.focus();}
  function sluit(){$('modal').classList.remove('open');$('modaldoos').innerHTML='';}
  $('modal').addEventListener('click',function(e){if(e.target===$('modal')||e.target.closest('[data-sluit]')) sluit();});
  addEventListener('keydown',function(e){if(e.key==='Escape') sluit();});
  function confirm2(tekst,ja){
    open('<h3>Zeker weten?</h3><p>'+esc(tekst)+'</p><div class="knoppen"><button class="knop lijn" type="button" data-sluit>Annuleren</button><button class="knop gevaar" type="button" id="c-ja">Verwijderen</button></div>');
    $('c-ja').addEventListener('click',function(){sluit();ja();});
    return true;
  }

  /* ---------- Sessie herstellen ---------- */
  try{var s=JSON.parse(sessionStorage.getItem(OPSLAG)||'null'); if(s&&s.refresh){sessie=s; start().catch(function(){uitloggen();});}}catch(e){}
})();
</script>
</body>
</html>
